name: Charli Chexx V25 GitHub Beta 0.9.1 to 0.9.2 (ISOLATED)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v25-github-qa.yml']
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: v25-github-qa-isolated-prereleases
  cancel-in-progress: true

jobs:
  build-and-publish-prerelease:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - name: Checkout public CHEXX release infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact reviewed private V25 source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: yousefayat732-prog/CHEXX
          ref: 3db41ad08c4f96858417ce6aedbc957f7a303a07
          ssh-key: ${{ secrets.CHEXX_PRIVATE_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false
      - name: Node 22 with pinned NPM lockfile
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: .NET 10 for official Velopack CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install same Velopack CLI as embedded NPM SDK
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw 'VPK installation failed' }
      - name: Build, verify, and publish only V25 GithubSource prereleases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        run: ./.github/scripts/v25-github-qa-publish.ps1

# No stable release tags, no public production updater, no user PC access.
# Both dedicated QA test releases only go live AFTER test builds, packaging
# and hash checks succeed; GithubSource uses prerelease=true in QA only.
