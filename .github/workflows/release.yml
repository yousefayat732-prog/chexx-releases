name: CHEXX Verified Windows Release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version; pinned private CHEXX source must match'
        required: true
        default: '0.8.8'
        type: string
permissions:
  contents: write
concurrency:
  group: chexx-release-${{ inputs.version || '0.8.8' }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned CHEXX source (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: yousefayat732-prog/CHEXX
          ref: 1b5c7dc012a5b450767d97a67b4d3bd47aa06ece
          ssh-key: ${{ secrets.CHEXX_PRIVATE_SOURCE_DEPLOY_KEY }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify approved source and draft target
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.version || '0.8.8' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:TARGET_VERSION
          if($v -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'){throw 'Invalid semantic version'}
          $pkg=Get-Content source/package.json -Raw|ConvertFrom-Json
          $channel=Get-Content source/update-channel.json -Raw|ConvertFrom-Json
          if($pkg.version -ne $v){throw 'Source package version mismatch'}
          $sourceCommit=(& git -C source rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $sourceCommit -ne '1b5c7dc012a5b450767d97a67b4d3bd47aa06ece'){throw 'Unexpected source commit'}
          if($channel.owner -ne 'yousefayat732-prog' -or $channel.repo -ne 'chexx-releases'){throw 'Wrong update channel'}
          # GitHub returns 404 for a DRAFT when queried by /releases/tags/<tag>.
          # Find it through the authenticated release collection, then use the release ID.
          $candidates=@(gh api ('repos/'+$env:GITHUB_REPOSITORY+'/releases?per_page=100') | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot list draft releases'}
          $matches=@($candidates | Where-Object {$_.tag_name -eq ('v'+$v) -and $_.draft -eq $true})
          if($matches.Count -gt 1 -or ($matches.Count -eq 1 -and $matches[0].prerelease)){throw 'Conflicting release drafts'}
          if($matches.Count -eq 0){
            $allTags=@($candidates | Where-Object {$_.tag_name -eq ('v'+$v)})
            if($allTags.Count -ne 0){throw 'Version already released; refusing overwrite'}
            $newDraft=& gh api -X POST ('repos/'+$env:GITHUB_REPOSITORY+'/releases') -f ('tag_name=v'+$v) -f ('name=Charli Chexx '+$v+' - V21-V24') -f 'target_commitish=main' -F draft=true -F prerelease=false | ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or !$newDraft.draft -or !$newDraft.id){throw 'Cannot create safe draft release'}
            $matches=@($newDraft)
          }
          Write-Output ('APPROVED_RELEASE_DRAFT_ID='+$matches[0].id)
      - name: Install locked dependencies
        working-directory: source
        run: npm ci
      - name: Run entire automated test suite
        working-directory: source
        run: npm test
      - name: Build Windows x64 NSIS installer
        working-directory: source
        # electron-builder auto-publishes when CI=true unless disabled explicitly.
        # GitHub assets are published only after all later verification steps pass.
        run: npm run dist -- --publish never
      - name: Verify 240 packaged chess pieces, 8 previews, 10 boards and installer checksum
        working-directory: source
        run: node scripts/verify-release.mjs
      - name: Attach verified assets and publish only on complete success
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.version || '0.8.8' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $v=$env:TARGET_VERSION
          $tag='v'+$v
          $sourceDir=Join-Path $env:GITHUB_WORKSPACE 'source'
          $releaseDir=Join-Path $sourceDir ('release-v'+$v)
          $exe=Join-Path $releaseDir ('CHEXX Setup '+$v+'.exe')
          $sum=$exe+'.sha256'
          $qa=Join-Path $releaseDir 'RELEASE_QA_MANIFEST.json'
          foreach($f in @($exe,$sum,$qa)){if(!(Test-Path -LiteralPath $f)){throw ('Missing verified file '+$f)}}
          $digest=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=((Get-Content $sum -Raw).Trim().Split(' ')[0]).ToLowerInvariant()
          if($digest -ne $expected){throw 'SHA256 installer mismatch'}
          $manifest=Get-Content $qa -Raw|ConvertFrom-Json
          if($manifest.version -ne $v -or $manifest.boardsVerified -ne 10 -or $manifest.piecesVerified -ne 240 -or $manifest.privateAudioBundled -or !$manifest.updateHelperPackaged -or !$manifest.updateLauncherPackaged){throw 'Release QA manifest mismatch'}
          $manifest.status='RELEASE_VERIFIED_ONLINE_UPDATE_TEST_PENDING'
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $qa -Encoding utf8
          $sourceZip=Join-Path $releaseDir ('CHEXX-'+$v+'-source.zip')
          # Archive tracked source only: no node_modules, build output or recursive archive.
          & git -C $sourceDir archive --format=zip HEAD -o $sourceZip
          if($LASTEXITCODE -ne 0 -or !(Test-Path $sourceZip)){throw 'Source archive creation failed'}
          $sourceSha=(Get-FileHash $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $sourceSum=$sourceZip+'.sha256'
          [IO.File]::WriteAllText($sourceSum,($sourceSha+'  CHEXX-'+$v+'-source.zip'+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          $candidates=@(gh api ('repos/'+$env:GITHUB_REPOSITORY+'/releases?per_page=100') | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0){throw 'Cannot list draft releases'}
          $matches=@($candidates | Where-Object {$_.tag_name -eq $tag -and $_.draft -eq $true})
          if($matches.Count -ne 1){throw 'Cannot find exactly one approved draft by tag'}
          $releaseId=$matches[0].id
          $draft=gh api ('repos/'+$env:GITHUB_REPOSITORY+'/releases/'+$releaseId) | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or !$draft.draft){throw 'Draft release not available'}
          # Parenthesize PowerShell expressions: without this, array elements
          # can collapse into one concatenated string in an @() expression.
          $expectedNames=@(
            ('CHEXX.Setup.'+$v+'.exe'),
            ('CHEXX.Setup.'+$v+'.exe.sha256'),
            ('CHEXX-'+$v+'-source.zip'),
            ('CHEXX-'+$v+'-source.zip.sha256'),
            'RELEASE_QA_MANIFEST.json'
          )
          foreach($asset in $draft.assets){
            if($asset.name -in $expectedNames){
              if($asset.state -ne 'starter'){throw ('Existing complete asset requires manual review: '+$asset.name)}
              & gh api -X DELETE ('repos/'+$env:GITHUB_REPOSITORY+'/releases/assets/'+$asset.id)
              if($LASTEXITCODE -ne 0){throw 'Cannot clean up incomplete upload'}
            }
          }
          # Upload draft assets by ID; gh release upload TAG may fail to resolve draft tags.
          $files=@($exe,$sum,$sourceZip,$sourceSum,$qa)
          $uploadBase=([string]$draft.upload_url).Split('{')[0]
          $prefix='https://uploads.github.com/repos/'+$env:GITHUB_REPOSITORY+'/releases/'+$releaseId+'/assets'
          if($uploadBase -ne $prefix){throw 'Unexpected GitHub upload host or release ID'}
          foreach($file in $files){
            $n=[IO.Path]::GetFileName($file)
            $url=$uploadBase+'?name='+[Uri]::EscapeDataString($n)
            $response=& gh api --method POST $url --input $file --header 'Content-Type: application/octet-stream' | ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or !$response.id -or $response.state -ne 'uploaded' -or [long]$response.size -ne (Get-Item $file).Length){throw ('Asset upload not confirmed: '+$n)}
            Write-Output ('UPLOADED='+$response.name+' BYTES='+$response.size)
          }
          $check=gh api ('repos/'+$env:GITHUB_REPOSITORY+'/releases/'+$releaseId)|ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot verify release'}
          foreach($name in $expectedNames){
            $matching=@($check.assets|Where-Object{$_.name -eq $name -and $_.state -eq 'uploaded'})
            if($matching.Count -ne 1){throw ('Missing verified asset '+$name)}
          }
          $installerAsset=@($check.assets|Where-Object{$_.name -eq ('CHEXX.Setup.'+$v+'.exe')})[0]
          if([long]$installerAsset.size -ne (Get-Item $exe).Length){throw 'Installer size mismatch'}
          if($installerAsset.digest -and $installerAsset.digest -ne ('sha256:'+$digest)){throw 'GitHub-reported installer digest mismatch'}
          $notes=Join-Path $releaseDir 'release-notes.txt'
          $body='Charli Chexx '+$tag+' – Windows x64 V21-V24 update. Adds timed bot games (Bullet/Blitz/Rapid/Daily), per-bot statistics, move-review and result UI, eight solar-system piece sets unlocking at levels 13-20, and 8 preview cards. Contains 240 complete chess piece images and 10 boards. V22 audio settings now expose five themes with independent volume categories; the original private WAVs are NOT bundled, as redistribution permission is not confirmed. Existing CHEXX.exe name, appId, profile storage, XP, rewards and saves remain unchanged. Updater retains required red backup acknowledgment and SHA-256 checks, plus persistent verification and helper diagnostics. All source tests and packaged-asset verification must pass before publication. Windows installer is unsigned and can trigger SmartScreen. A real GitHub-to-installed-app one-click update is not yet independently verified. Source code and license notices are in CHEXX-'+$v+'-source.zip.'
          [IO.File]::WriteAllText($notes,$body,[Text.UTF8Encoding]::new($false))
          # Publish by release ID; drafts cannot reliably be addressed by tag endpoints.
          $payload=Join-Path $releaseDir 'publish-payload.json'
          [IO.File]::WriteAllText($payload,(@{draft=$false;prerelease=$false;body=$body}|ConvertTo-Json -Compress),[Text.UTF8Encoding]::new($false))
          $published=gh api -X PATCH ('repos/'+$env:GITHUB_REPOSITORY+'/releases/'+$releaseId) --input $payload | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $published.draft -or $published.tag_name -ne $tag){throw 'Publish failed'}
          $latest=gh api ('repos/'+$env:GITHUB_REPOSITORY+'/releases/latest')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $latest.tag_name -ne $tag -or $latest.draft){throw 'Latest public release mismatch'}
          Write-Output ('CHEXX_GITHUB_RELEASE_VERIFIED=https://github.com/'+$env:GITHUB_REPOSITORY+'/releases/tag/'+$tag)
